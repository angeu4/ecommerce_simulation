<!doctype html>
<html>
  <head>
    <title>Admin UI</title>
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  </head>
  <body class="p-6">
    <div class="max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold">Admin UI (HTMX)</h2>
      <div class="mt-4">
        <p>Latest discount in cache: <strong>{{ latest }}</strong></p>
        <form hx-post="/admin/generate_discount" hx-swap="outerHTML">
          <button class="px-3 py-2 bg-red-600 text-white">Generate Discount (API)</button>
        </form>
      </div>
    </div>
  </body>
</html>
